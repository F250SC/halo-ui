name: Publish Halo UI current version

on:
  push:
    branches: [main]
    paths:
      - 'dist/halo-core.js'
      - 'dist/halo-ui.js'
      - 'dist/halo-dashboard-runtime.js'
      - 'dist/halo-ui-controller.js'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'F250SC/halo-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^export const HALO_UI_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' dist/halo-core.js)
          if [ -z "$version" ]; then
            echo "::error::Could not determine HALO_UI_VERSION from dist/halo-core.js"
            exit 1
          fi
          grep -Fq "HALO UI v${version}" dist/halo-ui.js
          echo "HALO_VERSION=$version" >> "$GITHUB_ENV"
          for file in dist/*.js; do node --input-type=module --check < "$file"; done
      - name: Publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${HALO_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Nothing to publish."
            exit 0
          fi
          gh release create "$tag" --target "${GITHUB_SHA}" --title "Halo UI $tag" --generate-notes
